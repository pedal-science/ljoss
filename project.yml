name: RigDesigner
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RigDesigner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RigDesigner
        excludes:
          # Two icon files whose names flatten to the same path in the bundle, which is a
          # build failure ("multiple commands produce …/icon.svg") rather than a warning.
          # The one in `Resources/` is the target's; this is the stray copy beside the
          # sources. The app icon itself comes from the asset catalogue.
          - "icon.svg"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rigdesigner
        PRODUCT_NAME: RigDesigner
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Rig Designer
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # iOS 14+ refuses a connection to a LAN address without this, and it fails
        # silently rather than with an error a client can report.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Rig Designer connects to your namchain device on the local network to send it the rig you are editing."
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
