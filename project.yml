name: RigDesigner
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RigDesigner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RigDesigner
        excludes:
          # The icon package is referenced below as one file wrapper. Without this the
          # glob descends into it and adds icon.json and its Assets as loose resources,
          # and the app icon silently does not build.
          - "Resources/AppIcon.icon"
      - path: RigDesigner/Resources/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.hemsley.ljoss
        PRODUCT_NAME: RigDesigner
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: RigDesigner/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Ljoss
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # iOS 14+ refuses a connection to a LAN address without this, and it fails
        # silently rather than with an error a client can report.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Rig Designer connects to your namchain device on the local network to send it the rig you are editing."
        TARGETED_DEVICE_FAMILY: "1,2"
        # iCloud key-value storage only works in a code-signed app carrying the
        # ubiquity-kvstore-identifier entitlement; without both, every write to
        # `NSUbiquitousKeyValueStore` silently no-ops. Signing must therefore stay
        # on — an ad-hoc build cannot carry the entitlement a real device accepts.
        DEVELOPMENT_TEAM: CW7QBC95TL
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        CODE_SIGN_ENTITLEMENTS: RigDesigner/RigDesigner.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
