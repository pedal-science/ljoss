name: RigDesigner
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RigDesigner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RigDesigner
        excludes:
          # The icon package is referenced below as one file wrapper. Without this the
          # glob descends into it and adds icon.json and its Assets as loose resources,
          # and the app icon silently does not build.
          - "Resources/AppIcon.icon"
          # An entitlements file is read by the code signer, not copied into the bundle: the glob
          # would otherwise add it to the resources phase and ship it.
          - "RigDesigner.entitlements"
      - path: RigDesigner/Resources/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rigdesigner
        PRODUCT_NAME: RigDesigner
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Rig Designer
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # iOS 14+ refuses a connection to a LAN address without this, and it fails
        # silently rather than with an error a client can report.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Rig Designer connects to your namchain device on the local network to send it the rig you are editing."
        # "Connect to this computer" starts namchaind here, and its audio input is a real device:
        # macOS asks the process that *spawns* the daemon for microphone access, which is this app.
        # Without a usage description the request is refused rather than explained, and the capture
        # is silence -- which looks exactly like a quiet room.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Rig Designer runs namchaind on this Mac and can capture from an audio input, so you can play a rig through it without a board."
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signed with a real team, not left to the linker's ad-hoc signature. macOS ties the
        # Local Network permission (and the keychain item holding the token) to the app's
        # signing identity. An ad-hoc identity changes with every build, so each rebuild
        # lost the permission and its connections failed with "Local network prohibited".
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CW7QBC95TL
        # The hardened runtime refuses an audio input device to a process that does not carry this
        # entitlement, and the child daemon inherits the grant from the app that spawned it.
        CODE_SIGN_ENTITLEMENTS: RigDesigner/RigDesigner.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
